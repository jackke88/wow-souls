[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["sam <samuv.eth@gmail.com>"]

[workspace.lints.clippy]
too_many_arguments = "allow"

[workspace.dependencies]
anyhow = "1.0.102"
bevy = { version = "0.18.1", default-features = false, features = [
    "default_app", "default_platform", "2d_bevy_render", "3d_bevy_render",
    "ui_api", "ui_bevy_render", "scene", "picking",
] }
wgpu = "27"
clap = { version = "4.6.1", features = ["derive"] }
sha1 = "0.10.6"
