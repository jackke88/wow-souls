[package]
name = "wow-souls"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Single-player third-person action prototype on the benilla WoW 1.12.1 world engine"

[lints]
workspace = true

[features]
# The dev seam, as in benilla: `--no-default-features` is the player build, which carries no
# source path and no engine instruments.
default = ["dev"]
dev = ["benilla-world/dev", "benilla-assets/dev", "benilla-formats/dev"]

[dependencies]
benilla-world.workspace = true
benilla-assets.workspace = true
benilla-formats.workspace = true
bevy.workspace = true
avian3d.workspace = true
anyhow.workspace = true
wscl.workspace = true
wow-world.workspace = true
cpal.workspace = true
symphonia.workspace = true
# The HUD art cache is PNG (already in Cargo.lock through Bevy and benilla).
png = "0.18"
# The graphics lanes upload their uniform rows with `bytemuck::cast_slice` (in Cargo.lock through Bevy).
bytemuck = { version = "1", features = ["derive"] }
# The native folder picker and message boxes for choosing the WoW client (`install.rs`).
rfd = "0.17"

[build-dependencies]
benilla-buildstamp.workspace = true
