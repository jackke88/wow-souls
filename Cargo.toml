[workspace]
resolver = "2"
members = ["crates/wow-souls", "crates/wow-world", "crates/wscl"]
# Source-study tools and the vendored engine have independent workspaces.
exclude = ["crates/dsr-cache", "crates/dsr-formats", "vendor/benilla"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
# A Bevy system's parameter list is its dependency declaration (as in benilla).
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.dependencies]
# The complete engine dependency closure lives here, with licences and revision/local
# fixes recorded in vendor/benilla/README.md. No sibling research checkout is needed.
# `default-features = false` so `--no-default-features` really drops their `dev` instruments.
benilla-world = { path = "vendor/benilla/crates/benilla-world", default-features = false }
benilla-assets = { path = "vendor/benilla/crates/benilla-assets", default-features = false }
benilla-formats = { path = "vendor/benilla/crates/benilla-formats", default-features = false }
benilla-buildstamp = { path = "vendor/benilla/crates/benilla-buildstamp" }
# benilla's Bevy, adding no features: Bevy's defaults would bring its audio stack back. The
# engine crates switch on the features they need and cargo unifies them.
bevy = { version = "0.18.1", default-features = false }
avian3d = "0.6"
anyhow = "1.0.102"
flate2 = "1.1"
glam = "0.31"
# The mixer: cpal opens the output device, symphonia decodes the WoW .wav files (PCM and ADPCM), WoW's
# .mp3 music and the Spoken Player pack's .ogg (Vorbis) quest voices.
cpal = "0.17"
symphonia = { version = "0.6", default-features = false, features = ["wav", "pcm", "adpcm", "mp3", "ogg", "vorbis"] }
wscl = { path = "crates/wscl" }
wow-world = { path = "crates/wow-world" }

# Profiles copied from benilla's root manifest; cargo reads them from the root only.
# Dependencies at opt-level 3 in dev: at opt-level 0, avian/parry collision drops to <1 fps.
[profile.dev.package."*"]
opt-level = 3

# Our crates at opt-level 1: Bevy's generic hot paths monomorphize into them.
[profile.dev]
opt-level = 1

# The shipping build (`--profile ship`).
[profile.ship]
inherits = "release"
lto = "fat"
codegen-units = 1
